appId: com.pi-frame.desktop
productName: pi-frame
copyright: Copyright 2026 pi-frame
electronVersion: 37.10.3

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: .cache/voice-model
    to: voice-model
  - from: resources/third-party
    to: third-party

asar: true
asarUnpack:
  - "**/*.node"
  - "**/*.wasm"
  # sherpa's native addon loads sibling shared libraries at runtime.
  - "**/node_modules/sherpa-onnx-*/**/*"
  - "**/node_modules/node-pty/**/*"
  - "**/node_modules/.pnpm/node-pty*/node_modules/node-pty/**/*"

artifactName: ${productName}-${version}-${arch}.${ext}

publish:
  provider: github
  owner: pi-frame
  repo: pi-frame

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  extendInfo:
    NSMicrophoneUsageDescription: "pi-frame uses the microphone for offline voice transcription."
  notarize: true
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  darkModeSupport: true
  extraFiles:
    - from: build/native/pi-gui-notification-status-helper
      to: MacOS/pi-gui-notification-status-helper

linux:
  category: Development
  executableName: pi-frame
  target:
    - target: AppImage

win:
  executableName: pi-frame
  signAndEditExecutable: true
  extraResources:
    - from: resources/computer-use
      to: computer-use
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

toolsets:
  appimage: "1.0.2"

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
